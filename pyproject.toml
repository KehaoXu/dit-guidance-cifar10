[project]
name = "dit-cifar10"
version = "0.1.0"
description = "Pixel-space class-conditional Diffusion Transformer (DiT) for CIFAR10, trained from scratch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "torchmetrics[image]>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=9.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "wandb>=0.16",
]

[tool.uv]
package = false